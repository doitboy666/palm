<!doctype html>

<head>
<meta charset="utf-8">

<title>Алақан мен Жұлдыз</title>

<style>
/* Layout: one narrow phone column, one question per screen, sticky progress on top, CTA pinned low */
:root{
  --ink:#191426;      /* night plum ground */
  --ink2:#241d36;     /* raised surface */
  --line:#3a3150;     /* hairlines */
  --paper:#f1e8d6;    /* parchment text */
  --mute:#a99fbd;     /* secondary text */
  --brass:#cfa85e;    /* accent */
  --rose:#e08f7d;     /* heart line */
  --sage:#8fd0b5;     /* money */
  --display:"Forum","Times New Roman",serif;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(120% 70% at 50% -10%,#2c2244 0%,var(--ink) 60%) fixed,var(--ink);color:var(--paper);font:16px/1.5 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{max-width:440px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-block:12px 24px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:2;background:var(--ink);padding-block:8px 12px;display:grid;grid-template-columns:32px 1fr auto 40px;align-items:center;gap:8px}
.back{background:none;border:0;color:var(--mute);font-size:22px;cursor:pointer;padding:0;height:32px}
.back:disabled{visibility:hidden}
.lang{background:none;border:1px solid var(--line);color:var(--brass);border-radius:20px;font:600 12px var(--body);padding:4px 10px;cursor:pointer;letter-spacing:.05em}
.brand{text-align:center;font-family:var(--display);font-size:19px;letter-spacing:.06em}
.count{text-align:right;color:var(--mute);font-size:13px;font-variant-numeric:tabular-nums}
.bar{grid-column:1/-1;height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brass);transition:width .4s}
main{flex:1;display:flex;flex-direction:column;gap:20px;padding-top:16px}
h1{font-family:var(--display);font-weight:400;font-size:30px;line-height:1.15;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:400;font-size:23px;margin:0}
p{margin:0}
.sub{color:var(--mute)}
.opts{display:grid;gap:10px}
.opt{width:100%;text-align:left;background:var(--ink2);border:1px solid var(--line);color:var(--paper);border-radius:12px;padding:15px 16px;font:inherit;cursor:pointer;display:flex;gap:12px;align-items:center}
.opt:hover{border-color:var(--mute)}
.opt[aria-pressed="true"]{border-color:var(--brass);background:#2e2540}
.opt .g{font-family:var(--display);font-size:22px;color:var(--brass);width:26px;text-align:center}
.cta{margin-top:auto;width:100%;background:var(--brass);color:#1c1526;border:0;border-radius:12px;padding:16px;font:600 16px var(--body);cursor:pointer;text-align:center;text-decoration:none;display:block}
.cta:disabled{opacity:.35;cursor:default}
.cta.alt{background:none;border:1px solid var(--brass);color:var(--brass)}
.ghost{background:none;border:0;color:var(--mute);font:inherit;text-decoration:underline;cursor:pointer;padding:4px}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
input,select{width:100%;background:var(--ink2);border:1px solid var(--line);color:var(--paper);border-radius:12px;padding:14px 16px;font:inherit}
label{display:grid;gap:6px;font-size:14px;color:var(--mute)}
.sign{display:flex;gap:14px;align-items:center;background:var(--ink2);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.sign b{font-family:var(--display);font-size:40px;font-weight:400;color:var(--brass);line-height:1}
.palm{position:relative;aspect-ratio:3/4;max-width:100%;border:1px dashed var(--line);border-radius:16px;overflow:hidden;background:var(--ink2);display:grid;place-items:center}
.palm img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.palm svg{position:absolute;inset:0;width:100%;height:100%}
.palm path{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-dasharray:300;stroke-dashoffset:300}
.palm.scan path{animation:draw 1.6s ease forwards}
.palm.scan path:nth-child(2){animation-delay:.5s}.palm.scan path:nth-child(3){animation-delay:1s}.palm.scan path:nth-child(4){animation-delay:1.5s}
.palm .ray{position:absolute;left:0;right:0;height:2px;background:var(--brass);box-shadow:0 0 18px 4px #cfa85e88;top:0;animation:ray 2.2s linear infinite;display:none}
.palm.scan .ray{display:block}
.palm .hint{color:var(--mute);text-align:center;padding:24px;font-size:14px}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes ray{0%{top:0}50%{top:100%}100%{top:0}}
.steps{display:grid;gap:12px;font-size:15px}
.steps div{display:flex;justify-content:space-between;color:var(--mute)}
.steps div.on{color:var(--paper)}
.steps div.ok::after{content:"✓";color:var(--brass)}
.meter{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--brass)}
.sec{display:grid;gap:8px;padding-block:16px;border-top:1px solid var(--line)}
.sec .k{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--brass)}
.locked{position:relative}
.locked .blur{filter:blur(6px);user-select:none;pointer-events:none}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.facts div{background:var(--ink2);border-radius:10px;padding:10px 4px}
.facts b{display:block;font-family:var(--display);font-size:22px;font-weight:400;color:var(--brass);font-variant-numeric:tabular-nums}
.facts span{font-size:12px;color:var(--mute)}
.matrix{background:var(--ink2);border:1px solid var(--line);border-radius:16px;padding:8px}
.matrix svg{display:block;width:100%;max-width:300px;margin:0 auto}
.legend{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px;margin-top:10px;padding:0 8px 8px}
.legend b{color:var(--brass);font-weight:500;text-align:right;white-space:nowrap}
.lines{display:grid;grid-template-columns:auto 1fr 40px;gap:8px 10px;align-items:center;font-size:14px}
.lines b{font-weight:500;text-align:right;font-variant-numeric:tabular-nums}
.palm canvas{position:absolute;inset:0;width:100%;height:100%}
.warn{color:var(--rose);font-size:14px}
.matrix text{font-family:var(--body);text-anchor:middle;dominant-baseline:central}
.plans{display:grid;gap:10px}
.plan{display:flex;justify-content:space-between;align-items:center}
.plan s{color:var(--mute);font-size:13px;margin-right:6px}
.badge{font-size:11px;background:var(--rose);color:#1c1526;border-radius:20px;padding:2px 8px;margin-left:8px}
.box{display:grid;gap:12px;background:var(--ink2);border:1px solid var(--brass);border-radius:16px;padding:16px}
.box ol{margin:0;padding-left:20px;display:grid;gap:6px}
.row{display:grid;grid-template-columns:1fr auto;gap:8px}
.row button{background:var(--brass);color:#1c1526;border:0;border-radius:12px;padding:0 18px;font:600 15px var(--body);cursor:pointer}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.err{color:var(--rose);font-size:14px}
.note{font-size:12px;color:var(--mute);text-align:center}
footer{font-size:11px;color:var(--mute);text-align:center;padding-top:20px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.palm path{stroke-dashoffset:0}}
</style>
</head>

  <header>
    <button class="back" id="back" aria-label="Назад">←</button>

</div>
<input type="file" id="file" accept="image/*" capture="environment" hidden>

<script>
// ===== НАСТРОЙКИ ВЛАДЕЛЬЦА: поменяй здесь и больше нигде =====
const CONFIG={
  wa:"77784714585",          // WhatsApp для чеков и заявок, только цифры
  tg:"",                     // Telegram ник без @ (пусто = кнопки нет)
  kaspi:"+7 778 471 45 85",  // номер для перевода
  receiver:"ИП Doitboy",     // как получатель видится в Kaspi
  pay:{full:"",year:"",yearup:"",pair:""}, // ссылки оплаты (Forte / Freedom Pay / Kaspi), когда появятся
  form:"",                   // Google Form ".../formResponse" для сбора контактов (пусто = не отправлять)
  fields:{name:"entry.1",contact:"entry.2",date:"entry.3",order:"entry.4",stage:"entry.5"},
  salt:"alash-palm-2026"     // секрет для кодов; поменяй один раз до запуска
};
const PLANS={
  full:{t:"Полный отчёт: ладонь, матрица, мүшел",tk:"Толық есеп: алақан, матрица, мүшел",p:1990,old:3990,u:["full"]},
  year:{t:"Полный отчёт и прогноз на год",tk:"Толық есеп және жылдық болжам",p:2990,old:5990,u:["full","year"],hit:1},
  yearup:{t:"Прогноз на год по матрице",tk:"Матрица бойынша жылдық болжам",p:1000,old:1990,u:["year"]},
  pair:{t:"Совместимость пары",tk:"Жұп үйлесімділігі",p:1490,old:2990,u:["pair"]}
};

const ZODIAC=[["Козерог","♑",1,19],["Водолей","♒",2,18],["Рыбы","♓",3,20],["Овен","♈",4,19],["Телец","♉",5,20],["Близнецы","♊",6,20],["Рак","♋",7,22],["Лев","♌",8,22],["Дева","♍",9,22],["Весы","♎",10,22],["Скорпион","♏",11,21],["Стрелец","♐",12,21],["Козерог","♑",13,0]];
const ELEMENT={Овен:"Огонь",Лев:"Огонь",Стрелец:"Огонь",Телец:"Земля",Дева:"Земля",Козерог:"Земля",Близнецы:"Воздух",Весы:"Воздух",Водолей:"Воздух",Рак:"Вода",Скорпион:"Вода",Рыбы:"Вода"};
const MATCH={Огонь:["Овен","Лев","Стрелец","Близнецы","Весы"],Земля:["Телец","Дева","Козерог","Рак","Скорпион"],Воздух:["Близнецы","Весы","Водолей","Лев","Стрелец"],Вода:["Рак","Скорпион","Рыбы","Телец","Дева"]};
function zodiac(d){const m=d.getMonth()+1,day=d.getDate();const z=ZODIAC.find(([, ,mm,last])=>m<mm||(m===mm&&day<=last))||ZODIAC[0];return{name:z[0],glyph:z[1]}}

// deterministic per-user randomness: same answers → same reading
function rng(str){let h=1779033703^str.length;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19}
  return()=>{h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return((h^=h>>>16)>>>0)/4294967296}}
const pick=(r,a)=>a[Math.floor(r()*a.length)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>`&#${c.charCodeAt(0)};`);
const money=n=>n.toLocaleString("ru")+" ₸";

// ===== Матрица судьбы: 22 аркана =====
// n — название, k — суть (бесплатный тизер), p — личность, m — деньги, l — отношения, t — урок кармического хвоста, y — тема года
const ARC=[null,
 {n:"Маг",k:"Сила начала: вы запускаете то, что другие только обсуждают.",p:"Быстрый ум, харизма, умение убеждать. Вы сильнее всего, когда сами держите инициативу. Тень: хвататься за десять идей и не доводить ни одну.",m:"Деньги идут через слово и инициативу: продажи, переговоры, свои проекты, обучение других. Рутина по чужому плану гасит этот поток.",l:"Вам нужен человек, которого интересно удивлять и с кем можно спорить на равных. Скука в паре для вас опаснее ссор.",t:"Урок прошлого: дар убеждения использовался ради выгоды. Задача сейчас — говорить правду и отвечать за свои слова.",y:"Год старта: начинайте новое, заявляйте о себе, учитесь говорить и продавать."},
 {n:"Жрица",k:"Сила интуиции: вы считываете людей раньше, чем они заговорят.",p:"Наблюдательность, глубина, умение хранить тайны. Вы много знаете и мало показываете. Тень: молчать о главном и копить обиды.",m:"Доход через знания и доверие: консультации, аналитика, обучение, работа с информацией. Лучше всего зарабатывается там, где вы эксперт.",l:"Вы раскрываетесь медленно, и это нормально. Рядом нужен спокойный человек, которому не всё надо объяснять словами.",t:"Урок: прятать свою силу из страха осуждения. Задача — делиться тем, что вы чувствуете и знаете.",y:"Год тишины и учёбы: меньше шума, больше наблюдений. Важные ответы придут через чутьё."},
 {n:"Императрица",k:"Сила изобилия: рядом с вами всё растёт и расцветает.",p:"Тепло, вкус, умение создавать красоту и уют. Люди тянутся к вам за заботой. Тень: растворяться в других и забывать о себе.",m:"Деньги любят у вас красоту и удовольствие: дизайн, еда, мода, бьюти, творчество — всё, что делает жизнь приятнее.",l:"Вам важно чувствовать себя желанным и ценным. В отношениях вы щедры, но нуждаетесь во взаимности, а не в потребителе.",t:"Урок: обесценивать себя и жить только ради семьи. Задача — позволить себе радость без чувства вины.",y:"Год роста: хорошее время для творчества, семьи, обновления дома и образа."},
 {n:"Император",k:"Сила порядка: вы строите систему там, где был хаос.",p:"Воля, ответственность, лидерство. Вы умеете брать решения на себя. Тень: жёсткость, контроль и желание, чтобы всё было по-вашему.",m:"Доход через управление и структуру: своё дело, руководство, строительство, госсектор. Деньги приходят, когда вы берёте ответственность.",l:"Вы надёжная опора, но партнёру нужно не только слушаться, но и быть услышанным. Мягкость — не слабость.",t:"Урок: власть без заботы. Задача — руководить, уважая свободу других.",y:"Год фундамента: наводите порядок в делах и документах, стройте длинный план."},
 {n:"Иерофант",k:"Сила учителя: вы передаёте знание и ценности.",p:"Мудрость, принципы, уважение к традициям и старшим. К вам идут за советом. Тень: поучать и считать, что знаете, как правильно всем.",m:"Деньги через обучение, наставничество, консультации, работу в больших системах. Ваш опыт сам по себе продукт.",l:"Вам важны общие ценности и серьёзные намерения. Союз строится надолго: знакомство с семьёй, традиции, уважение.",t:"Урок: навязывать свою истину. Задача — учить примером и слышать другое мнение.",y:"Год учёбы и наставников: учитесь, получайте документы и навыки, найдите своего учителя."},
 {n:"Влюблённые",k:"Сила выбора и любви: вы живёте сердцем.",p:"Обаяние, дружелюбие, чувство красоты, умение объединять людей. Тень: страх выбора и зависимость от чужого одобрения.",m:"Деньги через людей и партнёрство: команда, сервис, красота — всё, где важно нравиться и договариваться.",l:"Любовь — центральная тема вашей жизни. Выбирайте сердцем и головой одновременно и не теряйте себя ради другого.",t:"Урок: выбор из страха или нарушенное слово. Задача — делать честный выбор и отвечать за него.",y:"Год выбора: решения в любви и партнёрстве. Выбирайте осознанно."},
 {n:"Колесница",k:"Сила движения: вы созданы для цели и победы.",p:"Целеустремлённость, энергия, любовь к скорости и переменам. Тень: жить на бегу и не замечать, куда едешь.",m:"Доход через движение: поездки, логистика, спорт, проекты с дедлайнами, карьерный рост. Деньги приходят, когда цель ясна.",l:"Нужен партнёр-попутчик, который не тормозит, а едет рядом. Сидение на месте вас тяготит.",t:"Урок: идти по головам ради результата. Задача — побеждать, не разрушая других, и выбирать свою цель, а не чужую.",y:"Год рывка: поездки, переезды, повышение, смелые шаги вперёд."},
 {n:"Справедливость",k:"Сила равновесия: вы чувствуете, что честно, а что нет.",p:"Логика, порядочность, умение взвешивать. Вам доверяют решать споры. Тень: строго судить себя и других, жить по правилам вместо жизни.",m:"Деньги через документы, право, финансы, экспертизу, договоры. Всё, что сделано честно и прозрачно, приносит доход.",l:"Вам важен равный вклад в отношения. Когда баланс нарушен, вы остываете. Говорите об этом раньше.",t:"Урок: несправедливость к другим или к себе. Задача — быть честным без жестокости.",y:"Год баланса: закрываются старые долги, оформляются договоры, всё возвращается по заслугам."},

const dsum=n=>[...String(n)].reduce((a,c)=>a+ +c,0);
const r22=n=>{while(n>22)n=dsum(n);return n};
function matrix(date){
  const [y,m,d]=date.split("-").map(Number);
  const A=r22(d),B=r22(m),C=r22(dsum(y)),D=r22(A+B+C),E=r22(A+B+C+D);
  const sky=r22(B+D),earth=r22(A+C),X=r22(C+D),D1=r22(D+E),F=r22(A+B),G=r22(B+C),I=r22(A+D);
  let life=dsum(String(d)+m+y);while(life>9)life=dsum(life);
  return{A,B,C,D,E,F,G,I,sky,earth,purpose:r22(sky+earth),X,money:r22(C+X),love:r22(D+X),tail:[D,D1,r22(D+D1)],life,
    year:yy=>r22(A+B+r22(dsum(yy)))}}

const PHASE=[[1,"Мүшел жылы — год вашего зверя. Цикл начинается заново: время обновления, по традиции его встречают садақа и подарком вещи с себя."],
 [4,"Начало цикла: закладываете основу следующих 12 лет. Хорошо начинать, учиться, знакомиться."],
 [8,"Середина цикла: время реализации. То, что заложено в начале, начинает приносить плоды."],
 [11,"Сбор урожая: подводите итоги, закрепляйте результаты, отдавайте долги."],
 [12,"Канун мүшела: год подготовки. Завершайте старое, чтобы войти в новый цикл налегке."]];
const cycleYear=d=>d.getFullYear()-(d.getMonth()<2||(d.getMonth()===2&&d.getDate()<22)?1:0);
const animal=cy=>MUSHEL[((cy-2020)%12+12)%12];
function mushel(date,now=new Date()){
  const b=cycleYear(new Date(date+"T12:00")),n=cycleYear(now),diff=n-b,pos=diff%12+1;
  const k=pos===1&&diff>0?diff/12:Math.ceil(diff/12);
  return{a:animal(b),ai:((b-2020)%12+12)%12,pi:PHASE.findIndex(([p])=>pos<=p),cur:animal(n),pos,now:pos===1&&diff>0,next:b+12*k,jas:12*k+1,phase:PHASE.find(([p])=>pos<=p)[1]}}

(()=>{const M=matrix("1990-05-15");console.assert(M.A===15&&M.B===5&&M.C===19&&M.D===12&&M.E===6,"matrix");
  console.assert(mushel("1990-05-15").a[0]==="Жылқы"&&mushel("1990-02-01").a[0]==="Жылан","mushel");
  const t=mushel("2014-05-01",new Date("2026-10-21"));console.assert(t.now&&t.jas===13,"mushel jas")})();

 {n:"Сиқыршы",k:"Бастау күші: басқалар тек әңгімелейтін істі сіз қолға аласыз.",p:"Ұшқыр ой, тартымдылық, сендіре білу. Бастаманы өзіңіз ұстағанда ең күштісіз. Көлеңкесі: он идеяға бірдей жармасып, бірін де аяғына жеткізбеу.",m:"Ақша сөз бен бастама арқылы келеді: сауда, келіссөз, өз жобаларыңыз, басқаларды оқыту. Біреудің жоспарымен істелетін бір сарынды жұмыс бұл ағынды өшіреді.",l:"Сізге таңғалдыру қызық, тең дәрежеде пікір таластыра алатын адам керек. Жұптағы зерігу сіз үшін ұрыстан да қауіпті.",t:"Өткеннің сабағы: сендіру қабілеті пайда үшін қолданылған. Қазіргі міндет — шындықты айту және сөзіңізге жауап беру.",y:"Бастау жылы: жаңа істі бастаңыз, өзіңізді жариялаңыз, сөйлеуді және сатуды үйреніңіз."},
 {n:"Абыз ана",k:"Түйсік күші: адамдарды олар сөйлемей тұрып-ақ танисыз.",p:"Байқағыштық, тереңдік, құпия сақтай білу. Көп білесіз, аз көрсетесіз. Көлеңкесі: басты нәрсені айтпай, ішке өкпе жинау.",m:"Табыс білім мен сенім арқылы: кеңес беру, талдау, оқыту, ақпаратпен жұмыс. Сарапшы болған жеріңізде жақсы табасыз.",l:"Сіз баяу ашыласыз, бұл қалыпты жағдай. Қасыңызда бәрін сөзбен түсіндірудің қажеті жоқ сабырлы адам болғаны жөн.",t:"Сабақ: сыннан қорқып, күшіңізді жасыру. Міндет — сезгеніңіз бен білгеніңізбен бөлісу.",y:"Тыныштық пен оқу жылы: шу аз, бақылау көп. Маңызды жауаптар ішкі сезім арқылы келеді."},
 {n:"Патшайым",k:"Молшылық күші: қасыңызда бәрі өсіп, гүлдейді.",p:"Жылылық, талғам, сұлулық пен жайлылық жасай білу. Адамдар сізге қамқорлық іздеп келеді. Көлеңкесі: басқаларға беріліп, өзіңізді ұмыту.",m:"Ақша сізге сұлулық пен рахат арқылы келеді: дизайн, ас, сән, бьюти, шығармашылық — өмірді жайлырақ ететін бәрі.",l:"Сізге қалаулы әрі қадірлі екеніңізді сезіну маңызды. Қарым-қатынаста жомартсыз, бірақ тұтынушыны емес, өзара ықыласты қажет етесіз.",t:"Сабақ: өзіңізді бағаламау, тек отбасы үшін өмір сүру. Міндет — кінә сезімінсіз қуанышқа рұқсат беру.",y:"Өсу жылы: шығармашылыққа, отбасыға, үйді және бейнеңізді жаңартуға қолайлы уақыт."},
 {n:"Патша",k:"Тәртіп күші: бейберекет жерде жүйе құрасыз.",p:"Ерік, жауапкершілік, көшбасшылық. Шешімді өз мойныңызға ала білесіз. Көлеңкесі: қаталдық, бақылау, бәрі сіз айтқандай болсын деу.",m:"Табыс басқару мен құрылым арқылы: өз ісіңіз, басшылық, құрылыс, мемлекеттік сала. Жауапкершілік алғанда ақша келеді.",l:"Сіз сенімді тірексіз, бірақ серігіңізге тек тыңдау емес, тыңдалу да керек. Жұмсақтық — әлсіздік емес.",t:"Сабақ: қамқорлықсыз билік. Міндет — басқалардың еркіндігін құрметтей отырып басқару.",y:"Іргетас жылы: істер мен құжаттарды ретке келтіріп, ұзақ жоспар құрыңыз."},
 {n:"Ұстаз",k:"Ұстаз күші: сіз білім мен құндылықты жеткізесіз.",p:"Даналық, ұстаным, салт пен үлкенге құрмет. Сізден кеңес сұрайды. Көлеңкесі: ақыл айтып, бәріне не дұрыс екенін білемін деп ойлау.",m:"Ақша оқыту, тәлімгерлік, кеңес беру, үлкен жүйелердегі жұмыс арқылы келеді. Тәжірибеңіздің өзі — өнім.",l:"Сізге ортақ құндылық пен ниеттің байыптылығы маңызды. Одақ ұзаққа құрылады: отбасымен танысу, дәстүр, сыйластық.",t:"Сабақ: өз ақиқатын басқаға таңу. Міндет — үлгімен үйрету және басқа пікірді есту.",y:"Оқу мен ұстаз жылы: оқыңыз, құжат пен дағды алыңыз, өз ұстазыңызды табыңыз."},
 {n:"Ғашықтар",k:"Таңдау мен махаббат күші: сіз жүрекпен өмір сүресіз.",p:"Тартымдылық, ақжарқындық, сұлулықты сезіну, адамдарды біріктіре білу. Көлеңкесі: таңдаудан қорқу, басқалардың мақұлдауына тәуелділік.",m:"Ақша адамдар мен серіктестік арқылы келеді: команда, сервис, сұлулық — ұнау мен келісу маңызды жердің бәрі.",l:"Махаббат — өміріңіздің басты тақырыбы. Жүрек пен ақылды қатар қосып таңдаңыз, басқа үшін өзіңізді жоғалтпаңыз.",t:"Сабақ: қорқыныштан жасалған таңдау не бұзылған уәде. Міндет — адал таңдау жасап, оған жауап беру.",y:"Таңдау жылы: махаббат пен серіктестікте шешім қабылдайсыз. Саналы түрде таңдаңыз."},
 {n:"Күйме",k:"Қозғалыс күші: сіз мақсат пен жеңіс үшін жаралғансыз.",p:"Мақсаткерлік, қуат, жылдамдық пен өзгерісті сүю. Көлеңкесі: асығыс өмір сүріп, қайда бара жатқаныңызды байқамау.",m:"Табыс қозғалыс арқылы: сапар, логистика, спорт, мерзімі бар жобалар, мансаптық өсу. Мақсат анық болғанда ақша келеді.",l:"Сізге тежемейтін, қатар жүретін серік-жолдас керек. Бір орында тұру сізді жалықтырады.",t:"Сабақ: нәтиже үшін басқаларды аттап өту. Міндет — ешкімді құлатпай жеңу және бөтен емес, өз мақсатыңызды таңдау.",y:"Серпіліс жылы: сапарлар, көшу, қызметтегі өсу, батыл қадамдар."},
 {n:"Әділет",k:"Тепе-теңдік күші: не адал, не адал емес екенін сезесіз.",p:"Логика, адалдық, салмақтай білу. Дауды шешуді сізге сеніп тапсырады. Көлеңкесі: өзіңізді де, басқаны да қатаң соттау, өмірдің орнына ережемен өмір сүру.",m:"Ақша құжат, құқық, қаржы, сараптама, келісімшарт арқылы келеді. Адал әрі ашық жасалғанның бәрі табыс әкеледі.",l:"Сізге қарым-қатынастағы тең үлес маңызды. Тепе-теңдік бұзылса, суынасыз. Бұл туралы ертерек айтыңыз.",t:"Сабақ: басқаға не өзіңізге әділетсіздік. Міндет — қатыгездіксіз адал болу.",y:"Тепе-теңдік жылы: ескі қарыздар жабылады, келісімдер рәсімделеді, бәрі еңбегіңізге қарай қайтады."},
 {n:"Тақуа",k:"Данагөй күші: шудың орнына тереңдік.",p:"Талдағыш ой, дербестік, білім мен тыныштыққа құштарлық. Көлеңкесі: өз ішіңізге тұйықталу, адамдарға сенбеу.",m:"Табыс бір істі терең білу арқылы: зерттеу, IT, тәлімгерлік, онлайн жұмыс. Сізді дауысыңыз үшін емес, сапаңыз үшін бағалайды.",l:"Жұпта да сізге жеке кеңістік керек. Мұны түсінген адам ең адал жанды табады.",t:"Сабақ: оқшаулану және біліммен тәкаппарлану. Міндет — тәжірибеңізді қажет ететіндермен бөлісу.",y:"Ой елегінен өткізу жылы: адам аз, мағына көп. Оқуға және өз жолыңызды іздеуге жақсы."},
 {n:"Тағдыр дөңгелегі",k:"Сәттілік пен ағын күші: қозғалыста жүргенде жолыңыз болады.",p:"Жеңілдік, оптимизм, керек жерде дер кезінде бола білу. Көлеңкесі: әрекеттің орнына сәттілікті күту.",m:"Ақша сізге алмасу мен қозғалыс арқылы келеді: сауда, сапар, таныстық, сәтті жағдайлар. Мүмкіндікті жібермеу маңызды.",l:"Қарым-қатынас кездейсоқ кездесу мен бірге басынан өткерген оқиғалар арқылы дамиды. Бір сарындылық — жұбыңыздың басты жауы.",t:"Сабақ: өмірді өз ағымына жіберу. Міндет — мүмкіндікті ұстап, дөңгелекті өзіңіз айналдыру.",y:"Бетбұрыс жылы: күтпеген мүмкіндіктер. Жаңаға жиі «иә» деңіз."},
 {n:"Күш",k:"Мінез күші: басқаларды сындыратын нәрсені сіз көтересіз.",p:"Төзімділік, құштарлық, ішкі от, көп жұмыс істей білу. Көлеңкесі: шамадан тыс жүк, ашуланшақтық, бәрін жалғыз көтеруге тырысу.",m:"Табыс еңбек пен қуат арқылы: спорт, өз ісіңіз, адамдарды басқару. Шаршап-шалдықпаған кезде ақша келеді.",l:"Сізде құштарлық көп. Серігіңізге мінезіңізді көтере білу, ал сізге күшті нәзіктікпен жұмсарту маңызды.",t:"Сабақ: қысым мен ашу. Міндет — күшті жасампаздыққа бағыттау.",y:"Беріктікті сынау жылы: жұмыс пен қуат көп. Күшіңізді аяп, демалыңыз."},
 {n:"Ілулі адам",k:"Өзгеше көзқарас күші: әлемді басқа қырынан көресіз.",p:"Нәзіктік, көмекке әзірлік, стандарттан тыс ойлау. Көлеңкесі: құрбан рөлі мен күтумен тұрып қалу.",m:"Ақша стандарттан тыс істер арқылы: шығармашылық, адамдарға көмек, психология, рухани тәжірибелер. Борыш сезімімен тегін жұмыс істемеңіз.",l:"Сіз алғаныңыздан көп беруге бейімсіз. Сіздің жұбыңыз — құтқарудың емес, жай бірге болудың орны.",t:"Сабақ: тек басқалар үшін өмір сүру. Міндет — өзіңізді жоғалтпай көмектесу.",y:"Үзіліс жылы: бәрі тез болмайды. Уақытты жағдайға басқаша қарауға пайдаланыңыз."},
 {n:"Өзгеріс",k:"Жаңару күші: ескіні жауып, нөлден бастай білесіз.",p:"Батылдық, шешімділік, өзгеріске қабілет. Көлеңкесі: өзгерістен қорқу немесе, керісінше, бәрін бұзуға құмарлық.",m:"Табыс өзгерістер арқылы: дағдарыспен жұмыс, жөндеу, қайта өңдеу, бір нәрсені түрлендіру керек қызметтер.",l:"Қарым-қатынаста терең өзгерістерден өтесіз. Кеткенді жіберіңіз, өткенге жабыспаңыз.",t:"Сабақ: ескірген нәрсеге жабысу. Міндет — уақытында жіберу және жаңа тараудан қорықпау.",y:"Соңы мен басы жылы: жаңаға орын босату үшін бір нәрсе аяқталады."},
 {n:"Ұстамдылық",k:"Үйлесім күші: сіз алтын ортаны табасыз.",p:"Сабыр, төзім, әртүрліні бір тұтасқа біріктіре білу. Көлеңкесі: енжарлық, кез келген дау-дамайдан қашу.",m:"Ақша қамқорлық пен үйлесім арқылы: сервис, шығармашылық, педагогика, асықпай адамдармен жұмыс.",l:"Сіз жұпқа тыныштық әкелесіз. Сабырды немқұрайлылықпен шатастырмаңыз, қалауыңызды айтыңыз.",t:"Сабақ: шектен шығу. Міндет — тепе-теңдік: жұмыс пен демалыс, мен және басқалар.",y:"Қалпына келу жылы: сабырлы қарқын, үйлесім, қарым-қатынасты реттеу."},
 {n:"Ібіліс",k:"Тарту күші: сізде ақша мен құштарлықтың қуатты энергиясы бар.",p:"Тартымдылық, іскерлік, ықпал ете білу. Көлеңкесі: тәуелділік, айла-шарғы, тек пайда үшін өмір сүру.",m:"Күшті ақша арканы: өз ісіңіз, сауда, маркетинг, ықпал, ірі мәмілелер. Ең бастысы — ойын ережесінің адалдығы.",l:"Тартымдылығыңыз күшті. Қауіп — қызғаныш пен бір-біріне тәуелділік. Сау жұп еркіндікке құрылады.",t:"Сабақ: азғыру мен тәуелділік. Міндет — күшіңізге қызмет етпей, оны басқару.",y:"Азғыру мен ақша жылы: табыс табуға мүмкіндік бар, бірақ берілу қаупі де бар. Шекараңызды сақтаңыз."},
 {n:"Мұнара",k:"Жасампаз күші: ескінің орнына жаңаны саласыз.",p:"Қуат, батылдық, тез қайта құрыла білу. Көлеңкесі: тәкаппарлық, жоспардан тыс нәрсенің бәрін құлатқысы келу.",m:"Ақша құрылыс, ірі жобалар, жүйелердегі өзгерістер арқылы келеді. Бәрін бір картаға қоймаңыз.",l:"Жұбыңыз сынақтардан өтеді. Дауылға төтеп берген қарым-қатынас бәрінен берік болады.",t:"Сабақ: тәкаппарлық пен қатаң қабырғалар. Міндет — икемділік пен қайта құрылуға әзірлік.",y:"Қайта құру жылы: күрт өзгерістер болуы мүмкін. Жалғанға сүйенген құлайды."},

let PTS=null; // crease pixel indices on a 150×200 grid, session only
function scanPhoto(src){return new Promise(res=>{const im=new Image();im.onerror=()=>res(null);im.onload=()=>{
  const W=150,H=200,cv=document.createElement("canvas");cv.width=W;cv.height=H;const x=cv.getContext("2d",{willReadFrequently:true});
  const s=Math.max(W/im.width,H/im.height),w=im.width*s,h=im.height*s;x.drawImage(im,(W-w)/2,(H-h)/2,w,h);
  const d=x.getImageData(0,0,W,H).data,N=W*H,L=new Float32Array(N),skin=new Uint8Array(N);let sk=0;
  for(let i=0;i<N;i++){const r=d[i*4],g=d[i*4+1],b=d[i*4+2];L[i]=.3*r+.59*g+.11*b;
    if(r>95&&g>40&&b>20&&r>g&&r>b&&r-Math.min(g,b)>15){skin[i]=1;sk++}}
  const skinRatio=sk/N;if(skinRatio<.15){skin.fill(1);sk=N} // dim/odd light: scan the whole frame
  const W1=W+1,I=new Float64Array(W1*(H+1));
  for(let y=0;y<H;y++){let row=0;for(let q=0;q<W;q++){row+=L[y*W+q];I[(y+1)*W1+q+1]=I[y*W1+q+1]+row}}
  const R=5,diff=new Float32Array(N),vals=[];
  for(let y=0;y<H;y++)for(let q=0;q<W;q++){const i=y*W+q;if(!skin[i])continue;
    const x1=Math.max(0,q-R),x2=Math.min(W,q+R+1),y1=Math.max(0,y-R),y2=Math.min(H,y+R+1);
    diff[i]=(I[y2*W1+x2]-I[y1*W1+x2]-I[y2*W1+x1]+I[y1*W1+x1])/((x2-x1)*(y2-y1))-L[i];vals.push(diff[i])}
  vals.sort((a,b)=>b-a);const T0=Math.max(4,vals.length?vals[Math.floor(vals.length*.07)]:99),pts=[];
  for(let i=0;i<N;i++)if(skin[i]&&diff[i]>=T0)pts.push(i);
  const zone=(a,b,c,e)=>{let n=0,k=0;for(let y=c*H|0;y<e*H;y++)for(let q=a*W|0;q<b*W;q++){const i=y*W+q;if(skin[i]){k++;if(diff[i]>=T0)n++}}return k?n/k:0};
  const all=pts.length/sk,th=S.hand!=="l";
  const pct=z=>Math.max(30,Math.min(97,Math.round(60+30*Math.log2((z+1e-4)/(all+1e-4)))));
  res({pts,scan:{skin:+skinRatio.toFixed(2),n:pts.length,heart:pct(zone(.15,.85,.30,.45)),head:pct(zone(.15,.85,.45,.58)),
    life:pct(th?zone(.55,.85,.45,.85):zone(.15,.45,.45,.85)),fate:pct(zone(.40,.60,.50,.90))}})};im.src=src})}
function drawScan(cv,dur){ // photo darkened + detected creases revealed top-down behind the scan ray
  const x=cv.getContext("2d"),im=new Image();im.onload=()=>{
  const W=cv.width,H=cv.height,s=Math.max(W/im.width,H/im.height),w=im.width*s,h=im.height*s,k=W/150,t0=performance.now();
  const f=now=>{const p=dur?Math.min(1,(now-t0)/dur):1;x.drawImage(im,(W-w)/2,(H-h)/2,w,h);x.fillStyle="rgba(25,20,38,.5)";x.fillRect(0,0,W,H);
    x.fillStyle="#f3cf7a";const lim=p*200;for(const i of PTS){const y=i/150|0;if(y<=lim)x.fillRect((i%150)*k,y*k,k,k)}
    if(p<1&&cv.isConnected)requestAnimationFrame(f)};requestAnimationFrame(f)};im.src=S.photo}
const lineIdx=p=>Math.min(3,Math.max(0,Math.floor((p-30)/17)));

   ${sec(T(`Мүшел · ${U.pos}-й год цикла`,`Мүшел · циклдың ${U.pos}-жылы`),`${ph} ${U.now?T(`Сейчас ваш мүшел жас — ${U.jas} лет.`,`Қазір сіздің мүшел жасыңыз — ${U.jas}.`):T(`Ваш следующий мүшел жас — ${U.jas} лет, год ${U.a[0]} с Наурыза ${U.next}.`,`Келесі мүшел жасыңыз — ${U.jas}, ${U.a[0]} жылы, ${U.next} жылғы Наурыздан басталады.`)}`)}
   ${sec(T("Линия головы · ум","Ақыл сызығы · ой"),R.head)}${sec(T("Линия жизни · энергия","Өмір сызығы · қуат"),R.life)}${sec(T("Линия судьбы · путь","Тағдыр сызығы · жол"),R.fate)}
   ${R.advice.map(([k,t])=>sec(k+" · "+R.month,t)).join("")}
   ${sec(T("Совместимость по знаку","Белгі бойынша үйлесімділік"),T(`Сильнее всего вас дополняют ${R.match.join(", ")}. Стихия ${R.el} делает эти союзы спокойными и долгими.`,`Сізді ең жақсы толықтыратындар: ${R.match.map(zn).join(", ")}. ${eln(R.el)} стихиясы бұл одақтарды сабырлы әрі ұзақ етеді.`))}
   ${sec(T("Удачные дни в "+(/[ьй]$/.test(R.month)?R.month.slice(0,-1)+"е":R.month+"е"),`${R.month[0].toUpperCase()+R.month.slice(1)} айындағы сәтті күндер`),R.lucky.join(", ")+T(" число. Планируйте важные встречи и решения на эти даты."," күндері. Маңызды кездесулер мен шешімдерді осы күндерге жоспарлаңыз."))}
   ${sec(T("Род отца","Әке жағы")+" · аркан "+an(rF),arc(rF).k+T(" Это сила, которую передаёт мужская линия рода."," Бұл — рудың ер жағынан берілетін күш."))}
   ${sec(T("Род матери","Ана жағы")+" · аркан "+an(rM),arc(rM).k+T(" Это сила, которую передаёт женская линия рода."," Бұл — рудың ана жағынан берілетін күш."))}`;
  const yr=[R.year,R.year+1].map(y=>sec(`${y} ${T("год","жыл")} · аркан ${an(M.year(y))}`,arc(M.year(y)).y)).join("");
  const plan=PLANS[S.plan];
  return `<h1>${name}, ${T("ваш разбор готов","талдауыңыз дайын")}</h1>
   <div class="sign"><b>${R.z.glyph}</b><div><h2>${zn(R.z.name)}</h2><span class="sub">${T("Стихия","Стихия")}: ${eln(R.el)} · ${S.hand==="l"?T("левая рука","сол қол"):T("правая рука","оң қол")}</span></div></div>
   <div class="facts"><div><b>${M.A}</b><span>${T("аркан личности","тұлға арканы")}</span></div><div><b>${M.life}</b><span>${T("число судьбы","тағдыр саны")}</span></div><div><b style="font:500 19px/1.55 var(--body)">${U.a[0]}</b><span>${T("ваш мүшел","мүшеліңіз")}</span></div></div>
   ${msvg(M)}
   ${sec(T("Аркан личности · ","Тұлға арканы · ")+an(M.A),arc(M.A).k)}
   ${sec("Мүшел · "+mus,mtxt+(U.now?T(` ${R.year} — ваш мүшел жылы!`,` ${R.year} — сіздің мүшел жылыңыз!`):""))}
   ${S.scan?`<div class="sec"><span class="k">${T(`Скан ладони · найдено ${S.scan.n} точек линий`,`Алақан скані · ${S.scan.n} сызық нүктесі табылды`)}</span>
     ${PTS&&S.photo?'<div class="palm" style="width:200px;margin:0 auto"><canvas id="rc" width="300" height="400"></canvas></div>':""}
     <div class="lines">${(ru?[["Линия сердца","heart"],["Линия головы","head"],["Линия жизни","life"],["Линия судьбы","fate"]]:[["Жүрек сызығы","heart"],["Ақыл сызығы","head"],["Өмір сызығы","life"],["Тағдыр сызығы","fate"]]).map(([t,k])=>`<span>${t}</span><div class="meter"><i style="width:${S.scan[k]}%"></i></div><b>${S.scan[k]}%</b>`).join("")}</div>
     <p class="note">${T("Выраженность линии по фото: насколько складки в этой зоне глубже, чем в среднем по ладони.","Фото бойынша сызықтың айқындығы: осы аймақтағы қатпарлар алақанның орташа деңгейінен қаншалық терең.")}</p></div>`:""}
   ${sec(T("Линия сердца · любовь","Жүрек сызығы · махаббат"),R.heart)}
   ${lock(rest,full)}
   ${full?"":`<h2>${T("Откройте полный разбор","Толық талдауды ашыңыз")}</h2>
   <p class="sub">${T("Деньги, отношения, предназначение и кармический хвост по матрице, ваш год в цикле мүшел, все линии ладони.","Матрица бойынша ақша, қарым-қатынас, өмірлік мақсат және кармалық құйрық, мүшел циклындағы жылыңыз, алақанның барлық сызықтары.")}</p>
   <div class="plans">${["full","year"].map(p=>`<button class="opt plan" data-plan="${p}" aria-pressed="${S.plan===p}"><span>${ptitle(p)}${PLANS[p].hit?`<span class="badge">${T("хит","таңдаулы")}</span>`:""}</span><span><s>${money(PLANS[p].old)}</s><b>${money(PLANS[p].p)}</b></span></button>`).join("")}</div>
   <button class="cta" id="pay">${payLabel()}</button>
   <p class="note">${T("Разовый платёж, без подписок и автосписаний.","Бір реттік төлем, жазылым мен автоматты түрде есептен шығару жоқ.")}</p>`}
   <h2>${T("Прогноз на год","Жылдық болжам")}</h2>
   ${lock(yr,has("year"))}${has("year")||!full?"":buy("yearup")}
   <h2>${T("Совместимость пары","Жұп үйлесімділігі")}</h2>
   <label for="pdate">${T("Дата рождения партнёра","Серігіңіздің туған күні")}<input type="date" id="pdate" min="1920-01-01" max="2012-12-31" value="${S.pdate}"></label>
   <div id="pair">${pairHTML(M)}</div>
   <div id="paybox">${S.payOpen?paybox():""}</div>
   <p class="note">${T("Линии выделены по вашему фото автоматически, трактовка — по их выраженности и типовым формам; матрица и мүшел рассчитаны точно по дате рождения. Для саморазвития и развлечения.","Сызықтар фотоңыз бойынша автоматты түрде бөлінді, түсіндірме олардың айқындығы мен типтік пішіндеріне негізделген; матрица мен мүшел туған күніңіз бойынша дәл есептелді. Өзін-өзі дамыту және көңіл көтеру үшін.")}</p>`}
const payLabel=()=>T(`Открыть за ${money(PLANS[S.plan].p)}`,`${money(PLANS[S.plan].p)} төлеп ашу`);

function paybox(){
  const p=S.plan,P=PLANS[p],link=CONFIG.pay[p];
  const msg=T(`Здравствуйте! Оплатил(а) «${P.t}» ${money(P.p)}. Заказ №${S.order}, ${S.name.trim()}. Чек прикрепляю.`,`Сәлеметсіз бе! «${P.tk}» үшін ${money(P.p)} төледім. Тапсырыс №${S.order}, ${S.name.trim()}. Чекті жіберемін.`);
  return `<div class="box"><h2>${ptitle(p)} — ${money(P.p)}</h2>
   ${link?`<a class="cta" target="_blank" rel="noopener" href="${link}">${T("Оплатить картой","Картамен төлеу")}</a><p class="sub">${T("После оплаты пришлите чек — код доступа придёт в ответ.","Төлегеннен кейін чекті жіберіңіз — жауабында қолжетімділік коды келеді.")}</p>`:
   T(`<ol><li>Переведите <b>${money(P.p)}</b> по номеру <b>${CONFIG.kaspi}</b> (${CONFIG.receiver}).</li><li>В комментарии к переводу укажите <b>заказ №${S.order}</b>.</li><li>Пришлите чек — в ответ придёт 6-значный код доступа.</li></ol>`,
     `<ol><li><b>${money(P.p)}</b> соманы <b>${CONFIG.kaspi}</b> нөміріне аударыңыз (${CONFIG.receiver}).</li><li>Аударма түсініктемесіне <b>№${S.order} тапсырыс</b> деп жазыңыз.</li><li>Чекті жіберіңіз — жауабында 6 таңбалы қолжетімділік коды келеді.</li></ol>`)}
   ${contactLinks(msg,T("Отправить чек в WhatsApp","Чекті WhatsApp-қа жіберу"))}
   <label for="code">${T("Код доступа","Қолжетімділік коды")}<div class="row"><input id="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code"><button id="code-go">${T("Открыть","Ашу")}</button></div></label>
   <p class="err" id="code-msg" role="status"></p></div>`}

function admin(){ // owner-only: #admin → codes for an order number
  view.innerHTML=`<h1>Коды доступа</h1><label for="ao">Номер заказа<input id="ao" inputmode="numeric" maxlength="5"></label><div id="ac" class="opts"></div>
   <p class="note">Код привязан к номеру заказа покупателя. «Прогноз на год» открывает и доплату 1 000 ₸.</p>`;
  document.getElementById("ao").addEventListener("input",e=>{const o=e.target.value.trim();
    document.getElementById("ac").innerHTML=o.length===5?["full","year","pair"].map(p=>`<div class="sign"><b>${code(o,p)}</b><span class="sub">${PLANS[p].t}</span></div>`).join(""):""})}

function chrome(){ // header/footer texts follow the language
  document.documentElement.lang=T("ru","kk");
  document.title=T("Ладонь и Звёзды","Алақан мен Жұлдыз");
  document.getElementById("brand").textContent=T("Ладонь и Звёзды","Алақан мен Жұлдыз");
  document.getElementById("lang").textContent=T("ҚАЗ","РУС");
  document.getElementById("lang").setAttribute("aria-label",T("Қазақ тіліне ауысу","Переключить на русский"));
  const a=(h,t)=>`<a href="${h}" style="color:inherit">${t}</a>`;
  document.getElementById("foot").innerHTML=T(
   `Для саморазвития и развлечения. Не является медицинским, финансовым или юридическим советом.<br>Цены: полный отчёт 1 990 ₸ · с прогнозом на год 2 990 ₸ · прогноз на год 1 000 ₸ · совместимость 1 490 ₸. Оплата картой Visa / Mastercard, разовый платёж.<br>${a("oferta.html","Оферта и возврат")} · ${a("privacy.html","Конфиденциальность")}<br>ИП Doitboy · ИИН/БИН 950212350353 · г. Астана, ул. Бараева, 18/1-243 · ${a("https://wa.me/77784714585","+7 778 471 45 85")}`,
   `Өзін-өзі дамыту және көңіл көтеру үшін. Медициналық, қаржылық не заңгерлік кеңес емес.<br>Бағасы: толық есеп 1 990 ₸ · жылдық болжаммен 2 990 ₸ · жылдық болжам 1 000 ₸ · үйлесімділік 1 490 ₸. Visa / Mastercard картасымен, бір реттік төлем.<br>${a("oferta.html","Оферта және қайтару (орыс тілінде)")} · ${a("privacy.html","Құпиялылық")}<br>ЖК Doitboy · ЖСН/БСН 950212350353 · Астана қ., Бараев к-сі, 18/1-243 · ${a("https://wa.me/77784714585","+7 778 471 45 85")}`)}

function render(){
  chrome();
  document.getElementById("back").disabled=step===0||step>=QUESTIONS-1;
  document.getElementById("count").textContent=step<QUESTIONS?`${step+1}/${QUESTIONS}`:"";
  document.getElementById("bar").style.width=Math.min(100,(step+1)/QUESTIONS*100)+"%";
  view.innerHTML=STEPS[step]();
  if(step===1)showSign();
  if(step===QUESTIONS-1)analyse();
  const cv=document.getElementById(step===QUESTIONS?"rc":"cv");if(cv&&PTS)drawScan(cv,step===QUESTIONS?0:4200);
  store.set();
}
function go(n){step=n;render();window.scrollTo(0,0);if(n===QUESTIONS-1)lead("quiz")}
function showSign(){const el=document.getElementById("sign");if(!S.date){el.innerHTML="";return}
  const z=zodiac(new Date(S.date+"T12:00")),U=mushel(S.date);
  el.innerHTML=`<div class="sign"><b>${z.glyph}</b><div><h2>${zn(z.name)}</h2><span class="sub">${T("Стихия","Стихия")}: ${eln(ELEMENT[z.name])} · мүшел: ${U.a[0]}</span></div></div>`}
function analyse(){
  const rows=[...document.querySelectorAll("#st div")],m=document.getElementById("m");let i=0;
  const tick=()=>{if(step!==QUESTIONS-1)return;rows.forEach((r,j)=>{r.className=j<i?"ok":j===i?"on":""});m.style.width=i/rows.length*100+"%";
    if(i++<rows.length)setTimeout(tick,900);else setTimeout(()=>go(QUESTIONS),500)};tick()}
function openPay(p){S.plan=p;S.payOpen=true;render();document.getElementById("paybox").scrollIntoView({behavior:"smooth"});lead("pay:"+p)}
function tryCode(){
  const v=document.getElementById("code").value.trim(),hit=Object.keys(PLANS).find(p=>p!=="yearup"&&code(S.order,p)===v);
  if(!hit){document.getElementById("code-msg").textContent=T("Код не подошёл. Проверьте цифры или напишите нам.","Код сәйкес келмеді. Сандарды тексеріңіз немесе бізге жазыңыз.");return}
  S.own=[...new Set([...S.own,...PLANS[hit].u])];S.payOpen=false;lead("paid:"+hit);render();window.scrollTo(0,0)}

view.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b){if(e.target.closest("#palm"))file.click();return}
  if(b.dataset.k){const k=b.dataset.k,v=b.dataset.v;
    if(b.hasAttribute("data-multi")){S[k]=S[k].includes(v)?S[k].filter(x=>x!==v):[...S[k],v];render()}
    else{S[k]=v;b.setAttribute("aria-pressed","true");setTimeout(()=>go(step+1),180)}return}
  if(b.dataset.plan){S.plan=b.dataset.plan;view.querySelectorAll("[data-plan]").forEach(x=>x.setAttribute("aria-pressed",x===b));document.getElementById("pay").textContent=payLabel();if(S.payOpen)document.getElementById("paybox").innerHTML=paybox();return}
  if(b.dataset.buy){openPay(b.dataset.buy);return}
  if(b.id==="pay"){openPay(S.plan);return}
  if(b.id==="code-go"){tryCode();return}
  if(b.id==="retake"){file.click();return}
  if(b.id==="skip"){if(step===2)S.time="";go(step+1);return}
  if(b.id==="next"){if(step===6&&!S.photo){file.click();return}go(step+1)}
});
view.addEventListener("input",e=>{
  const t=e.target;if(t.id==="date"){S.date=t.value;showSign();document.getElementById("next").disabled=!S.date}
  if(t.id==="time")S.time=t.value;
  if(t.id==="name"){S.name=t.value;document.getElementById("next").disabled=!t.value.trim()}
  if(t.id==="contact"){S.contact=t.value;document.getElementById("next").disabled=!okContact(t.value)}
  if(t.id==="pdate"){S.pdate=t.value;document.getElementById("pair").innerHTML=pairHTML(matrix(S.date));store.set()}
});
view.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="code")tryCode()});
const file=document.getElementById("file");
file.addEventListener("change",()=>{const f=file.files[0];if(!f)return;const r=new FileReader();r.onload=async()=>{S.photo=r.result;S.scan=null;render();const o=await scanPhoto(S.photo);if(o){PTS=o.pts;S.scan=o.scan}render()};r.readAsDataURL(f);file.value=""});
document.getElementById("back").addEventListener("click",()=>step>0&&go(step-1));
document.getElementById("lang").addEventListener("click",()=>{S.lang=S.lang==="ru"?"kz":"ru";render()});
if(location.hash==="#admin")admin();else render();
</script>
</body>
</html>
